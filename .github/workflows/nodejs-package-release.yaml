name: The NPM package uploading

on:
  workflow_call:
    inputs:
      working-directory:
        required: false
        type: string
        default: '.'
      setup-action:
        required: false
        type: string
        default: 'setup-node-env'
      platform:
        required: false
        type: string
        default: 'npm'
      package-directory:
        required: false
        type: string
        default: '.'
      build-command:
        required: false
        type: string
        default: 'npm install'
      dry-run:
        required: false
        type: boolean
        default: false
      staged:
        required: false
        type: boolean
        default: false
    secrets:
      token:
        required: true

jobs:
  run-release:
    name: "Release NodeJS package"
    runs-on: ubuntu-24.04
    steps:
      - name: Validate ref
        if: ${{ !env.ACT }}
        run: |
          node -e '
            const ref = process.env.GITHUB_REF;
            console.log("Current ref:", ref);

            const isTag = ref.startsWith("refs/tags/");
            if (!isTag) {
              console.log(`Not Valid: must be running on tag (${ref})`);
              process.exit(1);
            }

            console.log("✅ Valid ref:", ref);
          '

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Validate tag commit
        if: ${{ !env.ACT }}
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/$DEFAULT_BRANCH"; then
            echo "Not Valid: tagged commit must be on the default branch ($DEFAULT_BRANCH)"
            exit 1
          fi

      - name: Get actions
        if: ${{ !env.ACT }}
        run: |
          git clone "$GITHUB_SERVER_URL/spigell/my-shared-workflows" ./.github/actions_ext

      - name: Install Act dependencies
        if: ${{ env.ACT }}
        uses: ./.github/actions/setup-act-env

      - name: Setup Node env
        if: ${{ inputs.setup-action == 'setup-node-env' }}
        uses: actions/setup-node@v6
        with:
          node-version: 22 # renovate: datasource=node-version depName=node

      - name: Setup Pulumi env
        if: ${{ inputs.setup-action == 'setup-pulumi-env' }}
        uses: ./.github/actions_ext/.github/actions/setup-pulumi-env
        with:
          runtime: nodejs
          working-directory: ${{ inputs.working-directory }}

      - name: Generate nodejs sdk package
        working-directory: ${{ inputs.working-directory }}
        run: ${{ inputs.build-command }}

      - name: Configure npmrc for Github registry
        if: ${{ inputs.platform == 'github' }}
        run: |
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.token }}" > ${{ inputs.package-directory }}/.npmrc
          echo "@spigell:registry=https://npm.pkg.github.com" >> ${{ inputs.package-directory }}/.npmrc

      - name: Publish package to the registry
        if: ${{ !inputs.staged }}
        uses: JS-DevTools/npm-publish@v4
        with:
          package: ${{ inputs.package-directory }}
          token: ${{ secrets.token }}
          dry-run: ${{ inputs.dry-run }}

      # Staged publishing: CI only submits the package to the staging area
      # (no 2FA required). A maintainer must approve it with 2FA via
      # `npm stage approve <id>` or on npmjs.com before it is released.
      # Requires npm CLI >= 11.15.0 and Node >= 22.14.0.
      - name: Update npm CLI for staged publishing
        if: ${{ inputs.staged }}
        # renovate: datasource=npm depName=npm
        run: npm install -g npm@11.15.0

      - name: Configure npmrc for npm registry (staged)
        if: ${{ inputs.staged }}
        run: echo "//registry.npmjs.org/:_authToken=${{ secrets.token }}" > ${{ inputs.package-directory }}/.npmrc

      - name: Stage publish package to the registry
        if: ${{ inputs.staged }}
        working-directory: ${{ inputs.package-directory }}
        run: npm stage publish ${{ inputs.dry-run && '--dry-run' || '' }}
