name: The NPM package uploading

on:
  workflow_call:
    inputs:
      working-directory:
        required: false
        type: string
        default: '.'
      setup-action:
        required: false
        type: string
        default: 'setup-node-env'
      platform:
        required: false
        type: string
        default: 'npm'
      package-directory:
        required: false
        type: string
        default: '.'
      build-command:
        required: false
        type: string
        default: 'npm install'
      dry-run:
        required: false
        type: boolean
        default: false
      staged:
        required: false
        type: boolean
        default: false
      trusted-publishing:
        required: false
        type: boolean
        default: false
      ref:
        required: false
        type: string
        default: ''
      version:
        required: false
        type: string
        default: ''
    secrets:
      token:
        required: false

jobs:
  run-release:
    name: "Release NodeJS package"
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Export release version
        if: ${{ inputs.version != '' }}
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: printf 'VERSION=%s\n' "$RELEASE_VERSION" >> "$GITHUB_ENV"

      - name: Validate trusted publishing options
        if: ${{ inputs.trusted-publishing && (inputs.staged || inputs.platform != 'npm') }}
        run: |
          echo "Trusted publishing requires platform: npm and staged: false"
          exit 1

      - name: Resolve release ref
        id: release-ref
        env:
          INPUT_REF: ${{ inputs.ref }}
        run: |
          if [[ -z "$INPUT_REF" ]]; then
            exit 0
          fi

          if [[ "$INPUT_REF" == refs/tags/* ]]; then
            tag="${INPUT_REF#refs/tags/}"
          elif [[ "$INPUT_REF" == refs/* ]]; then
            echo "Not Valid: ref must name a tag ($INPUT_REF)"
            exit 1
          else
            tag="$INPUT_REF"
          fi

          if ! git check-ref-format "refs/tags/$tag"; then
            echo "Not Valid: invalid tag name ($INPUT_REF)"
            exit 1
          fi
          echo "ref=refs/tags/$tag" >> "$GITHUB_OUTPUT"

      - name: Validate ref
        if: ${{ !env.ACT }}
        env:
          RELEASE_REF: ${{ steps.release-ref.outputs.ref || github.ref }}
        run: |
          node -e '
            const ref = process.env.RELEASE_REF;
            console.log("Current ref:", ref);

            const isTag = ref.startsWith("refs/tags/");
            if (!isTag) {
              console.log(`Not Valid: must be running on tag (${ref})`);
              process.exit(1);
            }

            console.log("✅ Valid ref:", ref);
          '

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.release-ref.outputs.ref }}
          fetch-depth: 0
          fetch-tags: true

      - name: Validate tag commit
        if: ${{ !env.ACT }}
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if ! git merge-base --is-ancestor HEAD "origin/$DEFAULT_BRANCH"; then
            echo "Not Valid: tagged commit must be on the default branch ($DEFAULT_BRANCH)"
            exit 1
          fi

      - name: Get actions
        if: ${{ !env.ACT }}
        run: |
          git clone "$GITHUB_SERVER_URL/spigell/my-shared-workflows" ./.github/actions_ext

      - name: Install Act dependencies
        if: ${{ env.ACT }}
        uses: ./.github/actions/setup-act-env

      - name: Setup Node env
        if: ${{ inputs.setup-action == 'setup-node-env' }}
        uses: actions/setup-node@v7
        with:
          node-version: 26 # renovate: datasource=node-version depName=node

      - name: Setup Pulumi env
        if: ${{ inputs.setup-action == 'setup-pulumi-env' }}
        uses: ./.github/actions_ext/.github/actions/setup-pulumi-env
        with:
          runtime: nodejs
          working-directory: ${{ inputs.working-directory }}

      - name: Generate nodejs sdk package
        working-directory: ${{ inputs.working-directory }}
        run: ${{ inputs.build-command }}

      - name: Configure npmrc for Github registry
        if: ${{ inputs.platform == 'github' }}
        run: |
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.token }}" > ${{ inputs.package-directory }}/.npmrc
          echo "@spigell:registry=https://npm.pkg.github.com" >> ${{ inputs.package-directory }}/.npmrc

      - name: Publish package to the registry
        if: ${{ !inputs.staged && !inputs.trusted-publishing }}
        uses: JS-DevTools/npm-publish@v4
        with:
          package: ${{ inputs.package-directory }}
          token: ${{ secrets.token }}
          dry-run: ${{ inputs.dry-run }}

      # Staged publishing: CI only submits the package to the staging area
      # (no 2FA required). A maintainer must approve it with 2FA via
      # `npm stage approve <id>` or on npmjs.com before it is released.
      # Requires npm CLI >= 11.15.0 and Node >= 22.14.0.
      - name: Update npm CLI for staged or trusted publishing
        if: ${{ inputs.staged || inputs.trusted-publishing }}
        # renovate: datasource=npm depName=npm
        run: npm install -g npm@11.15.0

      - name: Configure npmrc for npm registry (staged)
        if: ${{ inputs.staged }}
        run: echo "//registry.npmjs.org/:_authToken=${{ secrets.token }}" > ${{ inputs.package-directory }}/.npmrc

      - name: Stage publish package to the registry
        if: ${{ inputs.staged }}
        working-directory: ${{ inputs.package-directory }}
        run: npm stage publish ${{ inputs.dry-run && '--dry-run' || '' }}

      # Trusted publishing: npm exchanges the GitHub OIDC token for short-lived
      # credentials. The caller must grant id-token: write; no npm token or
      # .npmrc auth entry is needed. npm generates provenance automatically.
      # Requires npm CLI >= 11.5.1 and Node >= 22.14.0.
      - name: Publish package with npm trusted publishing
        if: ${{ inputs.trusted-publishing }}
        working-directory: ${{ inputs.package-directory }}
        run: npm publish --provenance --access public ${{ inputs.dry-run && '--dry-run' || '' }}
